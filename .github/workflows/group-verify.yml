name: Group backend verification

on:
  pull_request:
    branches: [test]
  push:
    branches: [feature/group-backend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run local database, HTTP and WAR tests
        run: mvn -B --no-transfer-progress clean verify
